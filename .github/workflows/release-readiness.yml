name: Release Readiness

on:
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      checkout_ref:
        description: Branch or SHA to validate
        required: false
        type: string

permissions:
  contents: read

jobs:
  critical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - name: Install root dependencies
        run: npm install --ignore-scripts
      - name: Install Desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Root Node suite
        run: node test-all.mjs
      - name: Go suite
        run: go test ./...
        working-directory: dashboard
      - name: Desktop TypeScript and Vite build
        run: npm run build
        working-directory: desktop
      - name: Desktop Vitest suite
        run: npm test
        working-directory: desktop
      - name: Build sidecar before Cargo
        run: npm run build:sidecar
        working-directory: desktop
      - name: Verify generated runtime package inputs
        run: node scripts/verify-packaged-runtime.mjs --generated
        working-directory: desktop
      - name: Cargo check
        run: cargo check --locked
        working-directory: desktop/src-tauri
      - name: Cargo tests
        run: cargo test --locked
        working-directory: desktop/src-tauri
      - name: Release metadata and version readiness
        run: |
          node scripts/release/version-consistency.mjs
          node scripts/release/validate-metadata.mjs
      - name: Whitespace check
        run: git diff --check "$(git merge-base origin/main HEAD)"...HEAD

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
      - name: Install root runtime dependencies
        run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: desktop
      - run: npm run build:sidecar
        working-directory: desktop
      - name: Verify generated macOS runtime
        run: node scripts/verify-packaged-runtime.mjs --generated
        working-directory: desktop
      - name: Build unsigned macOS app and DMG
        run: npx tauri build --ci --bundles app,dmg --config src-tauri/tauri.unsigned.conf.json
        working-directory: desktop
      - name: Ad-hoc sign app and smoke installed runtime
        run: |
          APP=$(find desktop/src-tauri/target/release/bundle/macos -name '*.app' -print -quit)
          test -n "$APP"
          for BIN in "$APP"/Contents/MacOS/*; do
            codesign --force --sign - --options runtime --pagesize 4096 "$BIN"
          done
          codesign --force --sign - --options runtime --pagesize 4096 "$APP"
          node desktop/scripts/verify-packaged-runtime.mjs --app "$APP"
      - name: Verify DMG
        run: |
          DMG=$(find desktop/src-tauri/target/release/bundle/dmg -name '*.dmg' -print -quit)
          test -s "$DMG"
          MOUNT=$(mktemp -d)
          cleanup() {
            set +e
            hdiutil detach "$MOUNT" >/dev/null 2>&1
            rmdir "$MOUNT" 2>/dev/null
            true
          }
          trap cleanup EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT" >/dev/null
          node desktop/scripts/verify-packaged-runtime.mjs --app "$MOUNT/CareerOps.app" --allow-unsigned-app

  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
      - name: Install root runtime dependencies
        run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: desktop
      - name: Build .exe sidecar
        run: npm run build:sidecar
        working-directory: desktop
      - name: Verify Windows sidecar name
        shell: pwsh
        run: |
          $triple = (rustc -vV | Select-String '^host:').ToString().Split()[1]
          $path = "desktop/src-tauri/binaries/career-data-$triple.exe"
          if (-not (Test-Path $path)) { throw "Missing Windows sidecar: $path" }
          $launcher = "desktop/src-tauri/binaries/careerops-node-$triple.exe"
          if (-not (Test-Path $launcher)) { throw "Missing Windows launcher: $launcher" }
      - name: Verify generated Windows runtime
        run: node scripts/verify-packaged-runtime.mjs --generated
        working-directory: desktop
      - name: Build unsigned Windows NSIS package
        run: npx tauri build --ci --bundles nsis --config src-tauri/tauri.unsigned.conf.json
        working-directory: desktop
      - name: Verify NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer -or $installer.Length -eq 0) { throw 'NSIS installer missing or empty' }
          $installDir = Join-Path $env:RUNNER_TEMP 'CareerOps-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)" }
          node desktop/scripts/verify-packaged-runtime.mjs --install-dir $installDir
          $signature = Get-AuthenticodeSignature (Join-Path $installDir 'runtime/careerops-node-runtime.exe')
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Node.js Foundation') {
            throw "Installed Node.js runtime signature is invalid or has the wrong signer: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
