name: Upstream Maintenance

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_update: ${{ steps.diff.outputs.has_update }}
      sync_branch: ${{ steps.branch.outputs.sync_branch }}
      has_protected: ${{ steps.protected.outputs.has_protected }}
      had_conflicts: ${{ steps.merge.outputs.has_conflicts }}
      upstream_sha: ${{ steps.diff.outputs.upstream_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Biweekly parity gate
        id: parity
        if: github.event_name == 'schedule'
        run: |
          WEEK=$(date +%V)
          if (( WEEK % 2 != 0 )); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped scheduled maintenance on odd ISO week $WEEK"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read upstream config
        if: steps.parity.outputs.skip != 'true'
        id: upstream
        run: |
          echo "repo=$(node -p "require('./.fork/upstream.json').repository")" >> "$GITHUB_OUTPUT"
          echo "branch=$(node -p "require('./.fork/upstream.json').branch")" >> "$GITHUB_OUTPUT"
          echo "last_sha=$(node -p "require('./.fork/upstream.json').lastIntegratedSha")" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream
        if: steps.parity.outputs.skip != 'true'
        env:
          UPSTREAM_REPO: ${{ steps.upstream.outputs.repo }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream "$UPSTREAM_BRANCH" --no-tags

      - name: Check for new commits
        if: steps.parity.outputs.skip != 'true'
        id: diff
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          LAST_SHA: ${{ steps.upstream.outputs.last_sha }}
        run: |
          UPSTREAM_SHA=$(git rev-parse "upstream/${UPSTREAM_BRANCH}")
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          if [ "$UPSTREAM_SHA" = "$LAST_SHA" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No upstream changes since $LAST_SHA"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create sync branch and record immutable base
        if: steps.diff.outputs.has_update == 'true'
        id: branch
        env:
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream_sha }}
        run: |
          BASE_SHA=$(git rev-parse HEAD)
          SHORT_SHA=${UPSTREAM_SHA:0:8}
          SYNC_BRANCH="automation/upstream-sync-$(date +%Y%m%d)-${SHORT_SHA}"
          git switch -c "$SYNC_BRANCH"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "SYNC_BRANCH=$SYNC_BRANCH" >> "$GITHUB_ENV"
          echo "sync_branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Probe merge conflicts without leaving a dirty merge
        if: steps.diff.outputs.has_update == 'true'
        id: merge
        env:
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream_sha }}
        run: |
          if git merge --no-ff --no-commit "$UPSTREAM_SHA"; then
            echo "has_conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
          fi
          git merge --abort

      - uses: actions/setup-node@v7
        if: steps.diff.outputs.has_update == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v7
        if: steps.diff.outputs.has_update == 'true'
        with:
          go-version-file: dashboard/go.mod
      - uses: dtolnay/rust-toolchain@stable
        if: steps.diff.outputs.has_update == 'true'
      - name: Install root and Desktop dependencies
        if: steps.diff.outputs.has_update == 'true'
        run: |
          npm install --ignore-scripts
          npm ci --prefix desktop

      - name: Run Codex maintenance
        if: steps.diff.outputs.has_update == 'true'
        uses: openai/codex-action@v1
        with:
          prompt-file: .github/prompts/upstream-maintenance.md
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream_sha }}
          LAST_SHA: ${{ steps.upstream.outputs.last_sha }}
          HAS_CONFLICTS: ${{ steps.merge.outputs.has_conflicts }}
          UPSTREAM_REPO: ${{ steps.upstream.outputs.repo }}

      - name: Verify Codex produced a clean integrated commit
        if: steps.diff.outputs.has_update == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream_sha }}
        run: |
          test -z "$(git status --short)"
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD

      - name: Detect protected infrastructure across the real change range
        if: steps.diff.outputs.has_update == 'true'
        id: protected
        run: |
          PROTECTED=$(node scripts/release/protected-paths.mjs --base "$BASE_SHA" --head HEAD)
          if [ "$PROTECTED" = "[]" ]; then
            echo "has_protected=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_protected=true" >> "$GITHUB_OUTPUT"
            echo "::warning::MANUAL REVIEW REQUIRED — protected paths changed: $PROTECTED"
          fi

      - name: Prepare the upstream-sync release non-interactively
        if: steps.diff.outputs.has_update == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.diff.outputs.upstream_sha }}
        run: npm run release:prepare:ci

      - name: Independent post-Codex critical CI
        if: steps.diff.outputs.has_update == 'true'
        run: node scripts/release/readiness.mjs --skip-package

      - name: Push reviewed sync branch
        if: steps.diff.outputs.has_update == 'true'
        run: git push origin "$SYNC_BRANCH"

  platform-packages:
    needs: upstream-sync
    if: needs.upstream-sync.outputs.has_update == 'true'
    uses: ./.github/workflows/release-readiness.yml
    with:
      checkout_ref: ${{ needs.upstream-sync.outputs.sync_branch }}

  create-pr:
    needs: [upstream-sync, platform-packages]
    if: needs.upstream-sync.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.upstream-sync.outputs.sync_branch }}
      - name: Create maintenance PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ needs.upstream-sync.outputs.sync_branch }}
          UPSTREAM_SHA: ${{ needs.upstream-sync.outputs.upstream_sha }}
          HAD_CONFLICTS: ${{ needs.upstream-sync.outputs.had_conflicts }}
          HAS_PROTECTED: ${{ needs.upstream-sync.outputs.has_protected }}
        run: |
          LABEL_ARGS=()
          if [ "$HAS_PROTECTED" = "true" ]; then LABEL_ARGS+=(--label manual-review-required); fi
          VERSION=$(node -p "require('./desktop/package.json').version")
          cat > "$RUNNER_TEMP/upstream-pr.md" <<EOF
          ## Upstream Sync

          - New upstream SHA: $UPSTREAM_SHA
          - Merge conflicts encountered: $HAD_CONFLICTS
          - Protected paths touched: $HAS_PROTECTED
          - Prepared Desktop version: $VERSION
          - Independent Node, Go, TypeScript, Vitest, sidecar, Cargo, macOS DMG, and Windows NSIS gates: passed
          EOF
          gh pr create \
            --head "$SYNC_BRANCH" \
            --title "chore(upstream): sync to ${UPSTREAM_SHA:0:8}" \
            --body-file "$RUNNER_TEMP/upstream-pr.md" \
            "${LABEL_ARGS[@]}"

      - name: Enable auto-merge only for unprotected conflict-free syncs
        if: needs.upstream-sync.outputs.had_conflicts == 'false' && needs.upstream-sync.outputs.has_protected == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ needs.upstream-sync.outputs.sync_branch }}
        run: gh pr merge --auto --squash "$SYNC_BRANCH"
