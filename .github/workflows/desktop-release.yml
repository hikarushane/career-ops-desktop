name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.fork/**'
      - 'packaging/**'
      - 'scripts/release/**'
      - 'RELEASE_NOTES.md'
      - 'release-prepared.json'

permissions:
  contents: read

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Require prepared production metadata
        run: node scripts/release/validate-metadata.mjs --prepared --production
      - id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/desktop-v${VERSION}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
      - name: Install root runtime dependencies
        run: npm ci --ignore-scripts
      - name: Install Desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build sidecar before Rust checks
        run: npm run build:sidecar
        working-directory: desktop
      - name: Verify generated macOS runtime
        run: node scripts/verify-packaged-runtime.mjs --generated
        working-directory: desktop
      - name: Cargo checks
        run: cargo check --locked && cargo test --locked
        working-directory: desktop/src-tauri
      - name: Build signed Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
      - name: Verify signed macOS app runtime
        run: |
          APP=$(find desktop/src-tauri/target/release/bundle/macos -name '*.app' -print -quit)
          test -n "$APP"
          node desktop/scripts/verify-packaged-runtime.mjs --app "$APP"
      - name: Collect canonical artifacts
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          TARGET=$(rustc -vV | awk '/^host:/ {print $2}')
          node scripts/release/artifacts.mjs collect \
            --platform macos \
            --bundle-dir desktop/src-tauri/target/release/bundle \
            --output release-assets \
            --version "$VERSION" \
            --target "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: release-assets/
          retention-days: 5

  build-windows:
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
      - name: Install root runtime dependencies
        run: npm ci --ignore-scripts
      - name: Install Desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Windows .exe sidecar before Rust checks
        run: npm run build:sidecar
        working-directory: desktop
      - name: Verify generated Windows runtime
        run: node scripts/verify-packaged-runtime.mjs --generated
        working-directory: desktop
      - name: Cargo checks
        run: cargo check --locked; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cargo test --locked
        working-directory: desktop/src-tauri
      - name: Build signed updater artifacts and NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
      - name: Verify installed Windows runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (-not $installer -or $installer.Length -eq 0) { throw 'NSIS installer missing or empty' }
          $installDir = Join-Path $env:RUNNER_TEMP 'CareerOps-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)" }
          node desktop/scripts/verify-packaged-runtime.mjs --install-dir $installDir
          $signature = Get-AuthenticodeSignature (Join-Path $installDir 'runtime/careerops-node-runtime.exe')
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Node.js Foundation') {
            throw "Installed Node.js runtime signature is invalid or has the wrong signer: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
      - name: Collect canonical artifacts
        shell: bash
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          TARGET=$(rustc -vV | awk '/^host:/ {print $2}')
          node scripts/release/artifacts.mjs collect \
            --platform windows \
            --bundle-dir desktop/src-tauri/target/release/bundle \
            --output release-assets \
            --version "$VERSION" \
            --target "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: release-assets/
          retention-days: 5

  publish-release:
    needs: [detect-release, build-macos, build-windows]
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Finalize ZIPs, updater manifest, provenance, and checksums
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          REPOSITORY=$(node -p "require('./.fork/release.json').repository")
          UPSTREAM_SHA=$(node -p "require('./.fork/upstream.json').lastIntegratedSha")
          node scripts/release/artifacts.mjs finalize \
            --assets-dir release-assets \
            --version "$VERSION" \
            --repository "$REPOSITORY" \
            --git-sha "$GIT_SHA" \
            --upstream-sha "$UPSTREAM_SHA"
          cat release-assets/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          gh release create "desktop-v${VERSION}" \
            --title "CareerOps Desktop v${VERSION}" \
            --notes-file release-assets/CURRENT_RELEASE_NOTES.md \
            release-assets/CareerOps_* \
            release-assets/CareerOps-* \
            release-assets/SHA256SUMS.txt \
            release-assets/latest.json \
            release-assets/release-provenance.json

  update-homebrew:
    needs: [detect-release, publish-release]
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: config
        name: Check Homebrew configuration
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAP=$(node -p "require('./.fork/release.json').homebrewTap || ''")
          if [ -z "$TAP" ] || [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Homebrew publish: CONFIGURATION REQUIRED (homebrewTap and HOMEBREW_TAP_TOKEN)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "tap=$TAP" >> "$GITHUB_OUTPUT"
          fi
      - name: Download released DMG
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: gh release download "desktop-v${VERSION}" --pattern "CareerOps_${VERSION}_macOS.dmg" --dir homebrew-assets
      - name: Update and push versioned cask
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ steps.config.outputs.tap }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          SHA=$(shasum -a 256 "homebrew-assets/CareerOps_${VERSION}_macOS.dmg" | awk '{print $1}')
          REPOSITORY=$(node -p "require('./.fork/release.json').repository")
          URL="https://github.com/${REPOSITORY}/releases/download/desktop-v${VERSION}/CareerOps_${VERSION}_macOS.dmg"
          gh repo clone "$TAP" homebrew-tap
          mkdir -p homebrew-tap/Casks
          cp packaging/homebrew/career-ops.rb homebrew-tap/Casks/career-ops.rb
          node scripts/release/homebrew.mjs \
            --file homebrew-tap/Casks/career-ops.rb \
            --version "$VERSION" \
            --url "$URL" \
            --sha256 "$SHA"
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/career-ops.rb
          git -C homebrew-tap commit -m "chore(cask): update CareerOps to ${VERSION}"
          git -C homebrew-tap push
