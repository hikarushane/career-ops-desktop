name: Desktop Release

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.fork/**'
      - 'packaging/**'
      - 'scripts/release/**'
      - 'RELEASE_NOTES.md'
      - 'release-prepared.json'
  workflow_dispatch:
    inputs:
      signing_policy:
        description: 'SignPath signing policy to submit against (dry runs use test-signing)'
        type: choice
        options:
          - test-signing
          - release-signing
        default: test-signing
      expected_signer:
        description: 'Regex the Authenticode certificate subject must match'
        type: string
        default: SignPath

permissions:
  contents: read

jobs:
  detect-release:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Require prepared production metadata
        run: node scripts/release/validate-metadata.mjs --prepared --production
      - id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/desktop-v${VERSION}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: detect-release
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
      - name: Install root runtime dependencies
        # The root package-lock.json is gitignored upstream (only desktop/ and
        # web/ keep one), so `npm ci` cannot run here; install from package.json.
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build sidecar before Rust checks
        run: npm run build:sidecar
        working-directory: desktop
      - name: Verify generated macOS runtime
        run: node scripts/verify-packaged-runtime.mjs --generated
        working-directory: desktop
      - name: Cargo checks
        run: cargo check --locked && cargo test --locked
        working-directory: desktop/src-tauri
      - name: Build signed Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
      - name: Verify signed macOS app runtime
        run: |
          APP=$(find desktop/src-tauri/target/release/bundle/macos -name '*.app' -print -quit)
          test -n "$APP"
          node desktop/scripts/verify-packaged-runtime.mjs --app "$APP"
      - name: Collect canonical artifacts
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          TARGET=$(rustc -vV | awk '/^host:/ {print $2}')
          node scripts/release/artifacts.mjs collect \
            --platform macos \
            --bundle-dir desktop/src-tauri/target/release/bundle \
            --output release-assets \
            --version "$VERSION" \
            --target "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: release-assets/
          retention-days: 5

  build-windows:
    needs: detect-release
    # A push builds Windows only for a real release (parity with build-macos); a
    # workflow_dispatch always reaches the job, because between releases main's
    # version tag already exists and should_release is false -- which is exactly
    # the state the signing dry runs have to be exercised in.
    if: github.event_name == 'workflow_dispatch' || needs.detect-release.outputs.should_release == 'true'
    runs-on: windows-latest
    # The SignPath API token and the organization/project ids live in this
    # environment, not at repository level, so no fork PR and no other workflow
    # can reach them; the environment's deployment-branch rule pins them to main.
    environment: release-signing
    # Replaces the workflow-level block for this job only. `actions: read` is
    # what the SignPath action needs to read job details and download the
    # uploaded artifact with github.token; nothing here writes.
    permissions:
      contents: read
      actions: read
    env:
      SIGNING_TRIPLE: x86_64-pc-windows-msvc
      # Neither expression can resolve empty on a push: the `||` fallback makes
      # release-signing / "SignPath Foundation" the only push-reachable values,
      # so a push can never select the test certificate. Defined once here and
      # referenced by both submit steps and every Authenticode assertion, so the
      # two halves cannot drift apart.
      SIGNING_POLICY_SLUG: ${{ github.event_name == 'workflow_dispatch' && inputs.signing_policy || 'release-signing' }}
      EXPECTED_SIGNER: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_signer || 'SignPath Foundation' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: dashboard/go.mod
      - name: Install root runtime dependencies
        # The root package-lock.json is gitignored upstream (only desktop/ and
        # web/ keep one), so `npm ci` cannot run here; install from package.json.
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build Windows .exe sidecar before Rust checks
        run: npm run build:sidecar
        working-directory: desktop
      - name: Verify generated Windows runtime
        run: node scripts/verify-packaged-runtime.mjs --generated
        working-directory: desktop
      - name: Cargo checks
        run: cargo check --locked; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; cargo test --locked
        working-directory: desktop/src-tauri

      - name: Check SignPath configuration
        id: signpath
        shell: pwsh
        env:
          CONFIGURED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          "configured=$($env:CONFIGURED)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:CONFIGURED -eq 'true') {
            Write-Host "::notice::Windows signing: SignPath policy '$($env:SIGNING_POLICY_SLUG)', expected signer /$($env:EXPECTED_SIGNER)/"
          } else {
            Write-Host "::notice::Windows signing: CONFIGURATION REQUIRED (SIGNPATH_ORGANIZATION_ID unset); building unsigned and asserting NotSigned"
          }

      # Build the executables WITHOUT bundling, so they can be signed before the
      # NSIS bundler packs them into the installer.
      - name: Build the Windows executables
        shell: pwsh
        working-directory: desktop
        run: |
          npx tauri build --ci --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed ($LASTEXITCODE)" }

      - name: Verify the Rust build outputs
        shell: pwsh
        run: |
          $releaseDir = 'desktop/src-tauri/target/release'
          $exes = @(Get-ChildItem $releaseDir -Filter *.exe -File)
          Write-Host "Executables in ${releaseDir}:"
          foreach ($exe in $exes) { Write-Host "  $($exe.Name)" }
          if ($exes.Name -notcontains 'desktop.exe') {
            throw "desktop.exe is missing from $releaseDir; the cargo package or mainBinaryName changed, and everything below signs the wrong file"
          }

      # ---- Phase 1: sign the executables -------------------------------------
      # The sidecars are signed here rather than after bundling because the NSIS
      # bundler packs them from desktop/src-tauri/binaries/, so the signed copies
      # have to be back in that directory before `tauri bundle` runs.
      - name: Stage the unsigned Windows executables
        if: steps.signpath.outputs.configured == 'true'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'signpath-binaries'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item 'desktop/src-tauri/target/release/desktop.exe' (Join-Path $staging 'desktop.exe')
          foreach ($name in @('career-data', 'careerops-node')) {
            $source = "desktop/src-tauri/binaries/$name-$($env:SIGNING_TRIPLE).exe"
            if (-not (Test-Path $source)) { throw "sidecar missing: $source" }
            Copy-Item $source (Join-Path $staging "$name.exe")
          }
          # No archive of our own: GitHub stores the uploaded files as one zip
          # and SignPath receives that zip, so the artifact configuration is a
          # single zip-file of pe-files rather than a zip inside a zip.

      - name: Upload the unsigned Windows executables
        id: unsigned_binaries
        if: steps.signpath.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-binaries
          path: ${{ runner.temp }}/signpath-binaries/*.exe
          retention-days: 1

      - name: Sign the Windows executables with SignPath
        if: steps.signpath.outputs.configured == 'true'
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-binaries
          github-artifact-id: ${{ steps.unsigned_binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: ${{ runner.temp }}/signed-binaries

      - name: Install the signed executables into the build tree
        if: steps.signpath.outputs.configured == 'true'
        shell: pwsh
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signed-binaries'
          $releaseDir = 'desktop/src-tauri/target/release'
          $binaries = 'desktop/src-tauri/binaries'
          function Get-SignedBinary([string] $fileName) {
            $found = @(Get-ChildItem $signed -Recurse -File -Filter $fileName)
            if ($found.Count -ne 1) { throw "expected exactly one $fileName under $signed, found $($found.Count)" }
            return $found[0].FullName
          }
          $verify = New-Object System.Collections.ArrayList
          $desktopExe = Join-Path $releaseDir 'desktop.exe'
          Copy-Item (Get-SignedBinary 'desktop.exe') $desktopExe -Force
          [void] $verify.Add($desktopExe)
          foreach ($name in @('career-data', 'careerops-node')) {
            $signedExe = Get-SignedBinary "$name.exe"
            # The bundler's source of truth, and every staged copy cargo made --
            # missing one of these is how an unsigned sidecar reaches the
            # installer while every other check still reports success.
            $targets = @("$binaries/$name-$($env:SIGNING_TRIPLE).exe")
            foreach ($staged in @("$releaseDir/$name.exe", "$releaseDir/$name-$($env:SIGNING_TRIPLE).exe")) {
              if (Test-Path $staged) { $targets += $staged }
            }
            foreach ($target in $targets) {
              Copy-Item $signedExe $target -Force
              [void] $verify.Add($target)
            }
          }
          foreach ($target in $verify) {
            $signature = Get-AuthenticodeSignature $target
            Write-Host "  $target -> $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch $env:EXPECTED_SIGNER) {
              throw "$target is not signed by the expected signer: $($signature.Status) $($signature.SignerCertificate.Subject)"
            }
          }

      # `tauri bundle` is the ONLY producer of a `-setup.exe.sig` when SignPath
      # is not configured, so the updater key has to be present on both paths.
      - name: Bundle the NSIS installer
        shell: pwsh
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri bundle --ci --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw "tauri bundle failed ($LASTEXITCODE)" }

      # ---- Phase 2: sign the installer, then re-sign it for the updater ------
      # With bundle.createUpdaterArtifacts the NSIS installer IS the updater
      # artifact (Tauri 2's v2 format), so there is nothing to repack: the
      # signed installer only has to be minisigned again.
      - name: Upload the unsigned Windows installer
        id: unsigned_installer
        if: steps.signpath.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 1

      - name: Sign the Windows installer with SignPath
        if: steps.signpath.outputs.configured == 'true'
        uses: SignPath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned_installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: ${{ runner.temp }}/signed-installer

      - name: Replace the unsigned installer with the signed installer
        if: steps.signpath.outputs.configured == 'true'
        shell: pwsh
        run: |
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          $installer = @(Get-ChildItem $bundle -File | Where-Object { $_.Name -like '*.exe' })
          if ($installer.Count -ne 1) { throw "expected exactly one NSIS installer in $bundle, found $($installer.Count)" }
          $signed = @(Get-ChildItem (Join-Path $env:RUNNER_TEMP 'signed-installer') -Recurse -File -Filter *.exe)
          if ($signed.Count -ne 1) { throw "expected exactly one signed installer from SignPath, found $($signed.Count)" }
          Copy-Item $signed[0].FullName $installer[0].FullName -Force
          $signature = Get-AuthenticodeSignature $installer[0].FullName
          Write-Host "  $($installer[0].Name) -> $($signature.Status) $($signature.SignerCertificate.Subject)"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch $env:EXPECTED_SIGNER) {
            throw "the signed installer is not signed by the expected signer: $($signature.Status) $($signature.SignerCertificate.Subject)"
          }

      # Tauri already minisigned the UNSIGNED installer. Deleting that signature
      # after the signed installer replaces it -- and proving it is gone -- is
      # what stops a valid-looking .sig over the unsigned bytes from being
      # collected and published.
      - name: Delete the stale updater signature
        if: steps.signpath.outputs.configured == 'true'
        shell: pwsh
        run: |
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          $stale = @(Get-ChildItem $bundle -File | Where-Object { $_.Name -like '*.exe.sig' })
          foreach ($file in $stale) { Write-Host "  removing $($file.Name)"; Remove-Item $file.FullName -Force }
          $left = @(Get-ChildItem $bundle -File | Where-Object { $_.Name -like '*.exe.sig' })
          if ($left.Count -ne 0) { throw "stale updater signature remains: $($left.Name -join ', ')" }

      - name: Sign the installer with the Tauri updater key
        if: steps.signpath.outputs.configured == 'true'
        shell: pwsh
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundle = 'src-tauri/target/release/bundle/nsis'
          $installer = @(Get-ChildItem $bundle -File | Where-Object { $_.Name -like '*.exe' })
          if ($installer.Count -ne 1) { throw "expected exactly one NSIS installer in $bundle, found $($installer.Count)" }
          $installerPath = $installer[0].FullName
          npx tauri signer sign $installerPath
          if ($LASTEXITCODE -ne 0) { throw "tauri signer sign failed ($LASTEXITCODE)" }
          if (-not (Test-Path "$installerPath.sig")) { throw "tauri signer sign produced no .sig next to $($installer[0].Name)" }

      # ---- Post-conditions: always, configured or not ------------------------
      # Asserting NotSigned on the unconfigured path is what stops a half-signed
      # release -- an unsigned build that silently skipped a signing step reads
      # identically to a successful one without it.
      - name: Verify the Authenticode signature of the packaged installer
        shell: pwsh
        env:
          CONFIGURED: ${{ steps.signpath.outputs.configured }}
        run: |
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          $installer = @(Get-ChildItem $bundle -File | Where-Object { $_.Name -like '*.exe' })
          if ($installer.Count -ne 1) { throw "expected exactly one NSIS installer in $bundle, found $($installer.Count)" }
          if (-not (Test-Path "$($installer[0].FullName).sig")) { throw "the installer has no updater signature (.sig)" }
          # The installer IS the updater artifact, so the signature is checked on
          # the published file itself; nothing is unpacked first.
          $signature = Get-AuthenticodeSignature $installer[0].FullName
          Write-Host "packaged installer: $($installer[0].Name) -> $($signature.Status) $($signature.SignerCertificate.Subject)"
          if ($env:CONFIGURED -eq 'true') {
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch $env:EXPECTED_SIGNER) {
              throw "the packaged installer is not signed by the expected signer: $($signature.Status) $($signature.SignerCertificate.Subject)"
            }
          } elseif ($signature.Status -ne 'NotSigned') {
            throw "SignPath is not configured, but the packaged installer reports $($signature.Status); refusing a half-signed release"
          }

      - name: Verify the updater signature
        shell: pwsh
        run: |
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          $installer = @(Get-ChildItem $bundle -File | Where-Object { $_.Name -like '*.exe' })
          if ($installer.Count -ne 1) { throw "expected exactly one NSIS installer in $bundle, found $($installer.Count)" }
          $installerPath = $installer[0].FullName
          $sigPath = "$installerPath.sig"
          # Read the shipped key from the config rather than pasting a copy here:
          # a verifier checked against a key nobody ships proves nothing.
          $pubkey = node -p "require('./desktop/src-tauri/tauri.conf.json').plugins.updater.pubkey"
          if ($LASTEXITCODE -ne 0) { throw "could not read plugins.updater.pubkey from tauri.conf.json ($LASTEXITCODE)" }
          node scripts/release/verify-minisign.mjs --pubkey "$pubkey" --file $installerPath --sig $sigPath
          if ($LASTEXITCODE -ne 0) { throw "the installer signature does not verify against the shipped public key ($LASTEXITCODE)" }
          # Negative control, in the same run: a verifier that accepts everything
          # would pass the check above too.
          $tampered = Join-Path $env:RUNNER_TEMP 'tampered-setup.exe'
          Copy-Item $installerPath $tampered -Force
          $bytes = [System.IO.File]::ReadAllBytes($tampered)
          $bytes[$bytes.Length - 1] = $bytes[$bytes.Length - 1] -bxor 0xFF
          [System.IO.File]::WriteAllBytes($tampered, $bytes)
          node scripts/release/verify-minisign.mjs --pubkey "$pubkey" --file $tampered --sig $sigPath
          if ($LASTEXITCODE -eq 0) { throw "the minisign verifier accepted a tampered installer" }
          Write-Host "negative control passed: the tampered installer was rejected"
          # The step's result is the last native exit code, and the last native
          # command above is the negative control, which is *supposed* to exit 1.
          # Clear it so the expected rejection does not fail the step (run
          # 34886768002 failed here with every check green).
          $global:LASTEXITCODE = 0

      - name: Verify installed Windows runtime
        shell: pwsh
        env:
          CONFIGURED: ${{ steps.signpath.outputs.configured }}
        run: |
          $bundle = 'desktop/src-tauri/target/release/bundle/nsis'
          $installer = @(Get-ChildItem $bundle -File | Where-Object { $_.Name -like '*.exe' })
          if ($installer.Count -ne 1 -or $installer[0].Length -eq 0) { throw 'NSIS installer missing or empty' }
          $installDir = Join-Path $env:RUNNER_TEMP 'CareerOps-installed'
          $process = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed with exit code $($process.ExitCode)" }
          node desktop/scripts/verify-packaged-runtime.mjs --install-dir $installDir
          if ($LASTEXITCODE -ne 0) { throw "verify-packaged-runtime.mjs --install-dir failed ($LASTEXITCODE)" }
          # Allowlist every PE the installer puts on disk. An executable nobody
          # listed is either a new artifact that nobody decided how to sign, or
          # one that quietly stayed unsigned -- both fail the build.
          $ours = @('desktop.exe', 'career-data.exe', 'careerops-node.exe')
          $pes = @(Get-ChildItem $installDir -Recurse -File | Where-Object { $_.Extension -in @('.exe', '.dll') })
          Write-Host "Portable executables under ${installDir}:"
          foreach ($pe in $pes) {
            $relative = $pe.FullName.Substring($installDir.Length).TrimStart('\')
            $signature = Get-AuthenticodeSignature $pe.FullName
            Write-Host "  $relative -> $($signature.Status) $($signature.SignerCertificate.Subject)"
          }
          foreach ($pe in $pes) {
            $relative = $pe.FullName.Substring($installDir.Length).TrimStart('\')
            $signature = Get-AuthenticodeSignature $pe.FullName
            if ($relative -eq 'runtime\careerops-node-runtime.exe') {
              # Node.js upstream, SHA-pinned by verify-packaged-runtime.mjs and never re-signed.
              if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Node\.js Foundation|OpenJS Foundation') {
                throw "Installed Node.js runtime signature is invalid or has the wrong signer: $($signature.Status) $($signature.SignerCertificate.Subject)"
              }
              continue
            }
            # NSIS writes uninstall.exe at install time, so it can never be signed.
            if ($relative -eq 'uninstall.exe') { continue }
            if ($ours -contains $relative) {
              if ($env:CONFIGURED -eq 'true') {
                if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch $env:EXPECTED_SIGNER) {
                  throw "$relative is not signed by the expected signer: $($signature.Status) $($signature.SignerCertificate.Subject)"
                }
              } elseif ($signature.Status -ne 'NotSigned') {
                throw "SignPath is not configured, but $relative reports $($signature.Status); refusing a half-signed release"
              }
              continue
            }
            throw "unexpected portable executable in the install directory: $relative (not on the allowlist)"
          }

      - name: Collect canonical artifacts
        shell: bash
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          TARGET=$(rustc -vV | awk '/^host:/ {print $2}')
          node scripts/release/artifacts.mjs collect \
            --platform windows \
            --bundle-dir desktop/src-tauri/target/release/bundle \
            --output release-assets \
            --version "$VERSION" \
            --target "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: release-assets/
          retention-days: 5

  publish-release:
    needs: [detect-release, build-macos, build-windows]
    if: github.event_name == 'push' && needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Finalize ZIPs, updater manifest, provenance, and checksums
        env:
          VERSION: ${{ needs.detect-release.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          REPOSITORY=$(node -p "require('./.fork/release.json').repository")
          UPSTREAM_SHA=$(node -p "require('./.fork/upstream.json').lastIntegratedSha")
          node scripts/release/artifacts.mjs finalize \
            --assets-dir release-assets \
            --version "$VERSION" \
            --repository "$REPOSITORY" \
            --git-sha "$GIT_SHA" \
            --upstream-sha "$UPSTREAM_SHA"
          cat release-assets/SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          gh release create "desktop-v${VERSION}" \
            --title "CareerOps Desktop v${VERSION}" \
            --notes-file release-assets/CURRENT_RELEASE_NOTES.md \
            release-assets/CareerOps_* \
            release-assets/CareerOps-* \
            release-assets/SHA256SUMS.txt \
            release-assets/latest.json \
            release-assets/release-provenance.json

  update-homebrew:
    needs: [detect-release, publish-release]
    if: needs.detect-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: config
        name: Check Homebrew configuration
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAP=$(node -p "require('./.fork/release.json').homebrewTap || ''")
          if [ -z "$TAP" ] || [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Homebrew publish: CONFIGURATION REQUIRED (homebrewTap and HOMEBREW_TAP_TOKEN)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "tap=$TAP" >> "$GITHUB_OUTPUT"
          fi
      - name: Download released DMG
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: gh release download "desktop-v${VERSION}" --pattern "CareerOps_${VERSION}_macOS.dmg" --dir homebrew-assets
      - name: Update and push versioned cask
        if: steps.config.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ steps.config.outputs.tap }}
          VERSION: ${{ needs.detect-release.outputs.version }}
        run: |
          SHA=$(shasum -a 256 "homebrew-assets/CareerOps_${VERSION}_macOS.dmg" | awk '{print $1}')
          REPOSITORY=$(node -p "require('./.fork/release.json').repository")
          URL="https://github.com/${REPOSITORY}/releases/download/desktop-v${VERSION}/CareerOps_${VERSION}_macOS.dmg"
          gh repo clone "$TAP" homebrew-tap
          mkdir -p homebrew-tap/Casks
          cp packaging/homebrew/career-ops.rb homebrew-tap/Casks/career-ops.rb
          node scripts/release/homebrew.mjs \
            --file homebrew-tap/Casks/career-ops.rb \
            --version "$VERSION" \
            --url "$URL" \
            --sha256 "$SHA"
          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add Casks/career-ops.rb
          git -C homebrew-tap commit -m "chore(cask): update CareerOps to ${VERSION}"
          git -C homebrew-tap push
